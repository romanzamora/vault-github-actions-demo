name: Retrieve a Vault secret with GitHub OIDC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  retrieve-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve the demo API key from Vault
        id: vault
        uses: hashicorp/vault-action@v2
        with:
          url: https://testv0-public-vault-c902eb3e.35c3df3d.z1.hashicorp.cloud:8200
          namespace: admin
          method: jwt
          path: jwt-github-actions
          role: github-actions-demo
          secrets: |
            secret/data/github-actions-demo demo-api-key | DEMO_API_KEY

      - name: Prove the secret was retrieved without printing it
        env:
          DEMO_API_KEY: ${{ steps.vault.outputs.DEMO_API_KEY }}
        run: |
          test -n "$DEMO_API_KEY"
          echo "Vault supplied the demo API key."
